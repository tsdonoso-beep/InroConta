# Bridge while the robots still write to the old database: copy it into v2 (pnpm db:mudanza)
#
# The web app (inroconta.vercel.app) reads only v2, and every robot above still writes to the old
# base (vqabgnynidehfqueupki). Without this, what Contabilidad sees stays frozen at the last move.
# It runs after each daily round of robots: the move must not read the old base while one of them
# is writing to it (a page may shift). Delete this workflow once the robots write to v2.

name: Mudanza a la base v2

on:
  schedule:
    # 10:30 and 19:00 in Lima (UTC-5): after the 07:00-09:40 and 16:00-17:30 rounds.
    - cron: '30 15 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: mudanza-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mudar:
    runs-on: ubuntu-latest
    # A full move took 5 min on the laptop on 21/10/2026.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --tolerar: the rows v2 rejects stay in dato_sin_ubicar; they end in a warning, not in red.
      # SUPABASE_SERVICE_ROLE_KEY_V1 reads only the two tables whose row rule the robot cannot pass
      # (solicitudes_memo, solicitud_personas). No artifact: the repository is public and the
      # reports carry whole rows.
      - name: Copiar la base vieja a la v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ROBOT_CORREO: ${{ secrets.ROBOT_CORREO }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          SUPABASE_URL_V2: ${{ secrets.SUPABASE_URL_V2 }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY_V1: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V1 }}
        run: pnpm db:mudanza --tolerar
